kind = "web"
previewPath = "/"
title = "UX Interview Coach"
version = "1.0.0"
id = "artifacts/ux-interview-coach"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18880

[services.development]
run = "pnpm --filter @workspace/ux-interview-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ux-interview-coach", "run", "build" ]
publicDir = "artifacts/ux-interview-coach/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18880"
BASE_PATH = "/"
